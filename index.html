<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="前日比">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-v2.png">
<title>五所川原 前日比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one screen on an iPhone (390×~760). Two compact comparison panels (昨日→今日, 今日→明日) and a 24h chart, no scrolling. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #1b2430;
  --muted: #5f6b7a;
  --line: #d5dbe3;
  --warm: #c94d17;
  --warm-soft: #fbe6da;
  --cool: #2864ab;
  --cool-soft: #dde9f7;
  --same: #5f6b7a;
  --same-soft: #e6eaef;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --font-num: "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --fg: #e8edf3; --muted: #93a0b0; --line: #2a3442;
    --warm: #ff8b55; --warm-soft: #3a2419; --cool: #6eaaf2; --cool-soft: #182a40;
    --same: #a3afbd; --same-soft: #232c37; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --fg: #e8edf3; --muted: #93a0b0; --line: #2a3442;
  --warm: #ff8b55; --warm-soft: #3a2419; --cool: #6eaaf2; --cool-soft: #182a40;
  --same: #a3afbd; --same-soft: #232c37; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 14px; padding-block: 8px 10px; display: grid; gap: 8px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.place { display: flex; align-items: baseline; gap: 8px; }
.place b { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.place small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
button.refresh {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
button.refresh:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
button.refresh[disabled] { opacity: .55; }

.panel {
  background: var(--surface); border-radius: 16px; padding: 10px 12px 10px;
  display: grid; gap: 7px; border: 1px solid var(--line);
}
.eyebrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.eyebrow span { font-size: 11px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.eyebrow em { font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.hero { display: flex; align-items: center; gap: 12px; }
.num {
  font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: .92;
  letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--tone); white-space: nowrap;
}
.num small { font-size: 24px; font-weight: 600; margin-left: 1px; }
.side { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.feel {
  font-size: 16px; font-weight: 700; color: var(--tone); background: var(--tone-soft);
  border-radius: 7px; padding: 1px 9px;
}
.wear { font-size: 13px; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ext { display: flex; gap: 10px; }
.ext b { font-family: var(--font-num); font-size: 14px; font-weight: 700; color: var(--tone); margin-left: 3px; }

[data-tone="warm"] { --tone: var(--warm); --tone-soft: var(--warm-soft); }
[data-tone="cool"] { --tone: var(--cool); --tone-soft: var(--cool-soft); }
[data-tone="same"] { --tone: var(--same); --tone-soft: var(--same-soft); }

.slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.slot {
  border-radius: 9px; background: var(--tone-soft); padding: 3px 1px 3px;
  display: grid; justify-items: center; text-align: center; line-height: 1.15;
}
.slot .h { font-size: 10px; color: var(--muted); }
.slot .d { font-family: var(--font-num); font-weight: 700; font-size: 17px; color: var(--tone); font-variant-numeric: tabular-nums; }
.slot .t { font-family: var(--font-num); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slot.now { outline: 2px solid var(--tone); outline-offset: -2px; }

.chart-panel { gap: 2px; padding-bottom: 6px; }
.legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-num); font-size: 10px; fill: var(--muted); }

.msg { font-size: 12px; color: var(--warm); }
footer { font-size: 10px; color: var(--muted); text-align: center; }
footer a { color: inherit; }
@media (max-width: 360px) { .num { font-size: 48px; } .slot .d { font-size: 15px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="place"><b>五所川原</b><small id="updated">読み込み中…</small></div>
    <button class="refresh" id="refresh" type="button">更新</button>
  </header>
  <div class="msg" id="msg" hidden></div>

  <section class="panel" id="p-today" data-tone="same">
    <div class="eyebrow"><span>いま ／ 昨日の同じ時刻と比べて</span><em id="t-now"></em></div>
    <div class="hero">
      <div class="num" id="t-num">—</div>
      <div class="side"><div class="feel" id="t-feel">…</div><div class="wear" id="t-wear"></div></div>
    </div>
    <div class="meta"><span id="t-sub"></span><span class="ext" id="t-ext"></span></div>
    <div class="slots" id="t-slots"></div>
  </section>

  <section class="panel" id="p-tomorrow" data-tone="same">
    <div class="eyebrow"><span>明日 ／ 今日の同じ時刻と比べて</span><em id="m-date"></em></div>
    <div class="hero">
      <div class="num" id="m-num">—</div>
      <div class="side"><div class="feel" id="m-feel">…</div><div class="wear" id="m-wear"></div></div>
    </div>
    <div class="meta"><span id="m-sub"></span><span class="ext" id="m-ext"></span></div>
    <div class="slots" id="m-slots"></div>
  </section>

  <section class="panel chart-panel">
    <div class="eyebrow"><span>3日間の気温</span>
      <div class="legend">
        <span><i style="border-top-style:dashed;border-color:var(--muted)"></i>昨日</span>
        <span><i style="border-color:var(--fg)"></i>今日</span>
        <span><i style="border-color:var(--warm)"></i>明日</span>
      </div>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 340 150" role="img" aria-label="昨日・今日・明日の時間別気温"></svg>
  </section>

  <footer>データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（気象モデル値）</footer>
</div>

<script>
(() => {
  const LAT = 40.8081, LON = 140.4469;
  const URL_API = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&hourly=temperature_2m&current=temperature_2m&timezone=Asia%2FTokyo&past_days=1&forecast_days=2";
  const CACHE_KEY = "gosho-zenjitsuhi-v1";
  const SLOT_HOURS = [6, 9, 12, 15, 18, 21];
  const $ = id => document.getElementById(id);
  let lastFetch = 0;

  const fmt = d => (d > 0.05 ? "+" : d < -0.05 ? "−" : "±") + Math.abs(d).toFixed(1);
  const fmtShort = d => {
    const r = Math.round(d);
    return r > 0 ? "+" + r : r < 0 ? "−" + Math.abs(r) : "±0";
  };
  const tone = d => (d >= 1 ? "warm" : d <= -1 ? "cool" : "same");
  function feel(d) {
    const a = Math.abs(d);
    if (a < 1) return "ほぼ同じ";
    if (d > 0) return a < 2.5 ? "少し暖かい" : a < 5 ? "暖かい" : a < 8 ? "かなり暖かい" : "季節が戻った暖かさ";
    return a < 2.5 ? "少しひんやり" : a < 5 ? "寒い" : a < 8 ? "かなり寒い" : "冬のような寒さ";
  }
  function wear(d, base) {
    if (d <= -5) return base + "より2枚分厚着を";
    if (d <= -2.5) return base + "より1枚多めに";
    if (d >= 5) return base + "より2枚分軽くてOK";
    if (d >= 2.5) return base + "より1枚少なめでOK";
    return base + "と同じ服装でOK";
  }

  function byDay(data) {
    const days = {};
    data.hourly.time.forEach((t, i) => {
      const [date, hm] = t.split("T");
      const h = parseInt(hm.slice(0, 2), 10);
      (days[date] ||= new Array(24).fill(null))[h] = data.hourly.temperature_2m[i];
    });
    return days;
  }
  function at(arr, fh) {
    const h = Math.floor(fh), f = fh - h;
    const a = arr[h], b = h < 23 ? arr[h + 1] : arr[h];
    if (a == null) return null;
    if (b == null) return a;
    return a + (b - a) * f;
  }
  const maxOf = a => Math.max(...a.filter(v => v != null));
  const minOf = a => Math.min(...a.filter(v => v != null));
  function shiftDate(s, n) {
    const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const jpDate = s => { const [, m, d] = s.split("-"); const w = "日月火水木金土"[new Date(s + "T12:00:00Z").getUTCDay()]; return (+m) + "/" + (+d) + "（" + w + "）"; };

  function renderSlots(el, cur, prev, nowH) {
    el.innerHTML = "";
    SLOT_HOURS.forEach(h => {
      const c = cur[h], p = prev[h];
      const div = document.createElement("div");
      div.className = "slot";
      if (c == null || p == null) { div.dataset.tone = "same"; div.innerHTML = '<span class="h">' + h + '時</span><span class="d">—</span>'; el.appendChild(div); return; }
      const d = c - p;
      div.dataset.tone = tone(d);
      if (nowH != null && Math.abs(h - nowH) < 1.5) div.classList.add("now");
      div.innerHTML = '<span class="h">' + h + '時</span><span class="d">' + fmtShort(d) + '</span><span class="t">' + Math.round(c) + '°</span>';
      div.title = h + "時 " + c.toFixed(1) + "℃（比較 " + p.toFixed(1) + "℃）";
      el.appendChild(div);
    });
  }
  function renderExt(el, cur, prev) {
    const dMax = maxOf(cur) - maxOf(prev), dMin = minOf(cur) - minOf(prev);
    el.innerHTML =
      '<span data-tone="' + tone(dMax) + '">最高' + Math.round(maxOf(cur)) + '°<b>' + fmt(dMax) + '</b></span>' +
      '<span data-tone="' + tone(dMin) + '">最低' + Math.round(minOf(cur)) + '°<b>' + fmt(dMin) + '</b></span>';
  }

  function renderChart(y, t, m, nowH) {
    const svg = $("chart");
    const W = 340, H = 150, L = 26, R = 8, T = 8, B = 18;
    const all = [...y, ...t, ...m].filter(v => v != null);
    let lo = Math.floor(Math.min(...all)) - 1, hi = Math.ceil(Math.max(...all)) + 1;
    const span = hi - lo, step = span > 16 ? 5 : span > 8 ? 2 : 1;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = h => L + (W - L - R) * h / 23;
    const yy = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const path = arr => arr.map((v, h) => v == null ? null : [x(h), yy(v)]).filter(Boolean)
      .map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    let s = "";
    for (let v = lo; v <= hi; v += step) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy(v) + '" y2="' + yy(v) + '" stroke="var(--line)" stroke-width="1"/>';
      s += '<text x="' + (L - 5) + '" y="' + (yy(v) + 3.5) + '" text-anchor="end">' + v + '°</text>';
    }
    [0, 6, 12, 18, 23].forEach(h => {
      s += '<text x="' + x(h) + '" y="' + (H - 4) + '" text-anchor="' + (h === 23 ? "end" : h === 0 ? "start" : "middle") + '">' + h + '時</text>';
    });
    if (nowH != null) s += '<line x1="' + x(nowH) + '" x2="' + x(nowH) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>';
    s += '<path d="' + path(y) + '" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3"/>';
    s += '<path d="' + path(t) + '" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linejoin="round"/>';
    s += '<path d="' + path(m) + '" fill="none" stroke="var(--warm)" stroke-width="2.2" stroke-linejoin="round"/>';
    if (nowH != null) { const v = at(t, nowH); if (v != null) s += '<circle cx="' + x(nowH) + '" cy="' + yy(v) + '" r="4" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/>'; }
    svg.innerHTML = s;
  }

  function render(data, fetchedAt) {
    const days = byDay(data);
    const curTime = (data.current && data.current.time) || null;
    const todayStr = curTime ? curTime.slice(0, 10) : Object.keys(days).sort()[1];
    const yStr = shiftDate(todayStr, -1), mStr = shiftDate(todayStr, 1);
    const Y = days[yStr], T = days[todayStr], M = days[mStr];
    if (!Y || !T || !M) throw new Error("data");

    const nowJst = new Date(Date.now() + 9 * 3600e3);
    const nowDate = nowJst.toISOString().slice(0, 10);
    let fh = nowJst.getUTCHours() + nowJst.getUTCMinutes() / 60;
    if (nowDate !== todayStr && curTime) fh = +curTime.slice(11, 13) + +curTime.slice(14, 16) / 60;
    fh = Math.min(fh, 23);
    const hm = String(Math.floor(fh)).padStart(2, "0") + ":" + String(Math.round((fh % 1) * 60)).padStart(2, "0");

    const nowTemp = (data.current && data.current.temperature_2m != null && nowDate === todayStr) ? data.current.temperature_2m : at(T, fh);
    const yThen = at(Y, fh);
    const d1 = nowTemp - yThen;
    $("p-today").dataset.tone = tone(d1);
    $("t-now").textContent = jpDate(todayStr) + " " + hm;
    $("t-num").innerHTML = fmt(d1) + "<small>℃</small>";
    $("t-feel").textContent = feel(d1);
    $("t-sub").textContent = "いま" + nowTemp.toFixed(1) + "℃ ／ 昨日" + yThen.toFixed(1) + "℃";
    $("t-wear").textContent = wear(d1, "昨日");
    renderSlots($("t-slots"), T, Y, fh);
    renderExt($("t-ext"), T, Y);

    const mThen = at(M, fh), tThen = at(T, fh);
    const d2 = mThen - tThen;
    $("p-tomorrow").dataset.tone = tone(d2);
    $("m-date").textContent = jpDate(mStr) + " " + hm;
    $("m-num").innerHTML = fmt(d2) + "<small>℃</small>";
    $("m-feel").textContent = feel(d2);
    $("m-sub").textContent = "明日" + mThen.toFixed(1) + "℃ ／ 今日" + tThen.toFixed(1) + "℃";
    $("m-wear").textContent = wear(d2, "今日");
    renderSlots($("m-slots"), M, T, null);
    renderExt($("m-ext"), M, T);

    renderChart(Y, T, M, fh);

    const f = new Date(fetchedAt + 9 * 3600e3);
    $("updated").textContent = "更新 " + (f.getUTCMonth() + 1) + "/" + f.getUTCDate() + " " +
      String(f.getUTCHours()).padStart(2, "0") + ":" + String(f.getUTCMinutes()).padStart(2, "0");
  }

  function showMsg(t) { const m = $("msg"); m.textContent = t || ""; m.hidden = !t; }

  async function load() {
    const btn = $("refresh");
    btn.disabled = true; btn.textContent = "取得中…";
    try {
      const res = await fetch(URL_API, { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const at0 = Date.now();
      render(data, at0);
      lastFetch = at0;
      showMsg("");
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: at0, data })); } catch (e) {}
    } catch (e) {
      showMsg("最新データを取得できませんでした。電波を確認して「更新」を押してください。" + (lastFetch ? "（前回の値を表示中）" : ""));
    } finally {
      btn.disabled = false; btn.textContent = "更新";
    }
  }

  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && c.data) { render(c.data, c.at); lastFetch = c.at; }
  } catch (e) {}
  if (window.__MOCK__) { render(window.__MOCK__, Date.now()); } else { load(); }

  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastFetch > 10 * 60e3) load();
  });
})();
</script>
</body>
</html>
